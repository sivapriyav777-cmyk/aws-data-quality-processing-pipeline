
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Automated AWS Data Quality Processing Pipeline

Resources:

  DataBucket:
    Type: AWS::S3::Bucket

  DataProcessingFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: src/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256

      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket

      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket

        - S3WritePolicy:
            BucketName: !Ref DataBucket

      Events:
        FileUpload:
          Type: S3
          Properties:
            Bucket: !Ref DataBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/

Outputs:

  BucketName:
    Value: !Ref DataBucket

  LambdaFunction:
    Value: !Ref DataProcessingFunction
